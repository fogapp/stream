name: CI

# GitHub's copy of .gitea/workflows/ci.yml: the same checks, on GitHub's
# hosted runners. Gitea reads .gitea/workflows first, so it never runs this
# one. bin/ci runs both of these plus the Playwright harness locally.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruby:
    runs-on: ubuntu-latest
    # A Ruby container rather than ruby/setup-ruby, so the system tools below
    # come from the same Debian release the production image (Dockerfile)
    # is built on.
    container:
      image: ruby:3.4.2-bookworm
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: stream
          POSTGRES_PASSWORD: stream
        options: >-
          --health-cmd "pg_isready -U stream" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      RAILS_ENV: test
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: stream
      DATABASE_PASSWORD: stream
      BUNDLE_JOBS: "4"
      BUNDLE_PATH: vendor/bundle
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bin/check-tracked
      # The tools the production image ships: specs shell out to real
      # pg_dump, tar+zstd and ffprobe, and quietly take a different path
      # when one is missing.
      - name: Install system tools
        run: |
          install -d /usr/share/postgresql-common/pgdg
          curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt bookworm-pgdg main' > /etc/apt/sources.list.d/pgdg.list
          install -d /etc/apt/keyrings
          curl -fsSL https://repo.jellyfin.org/jellyfin_team.gpg.key | gpg --dearmor -o /etc/apt/keyrings/jellyfin.gpg
          echo "deb [signed-by=/etc/apt/keyrings/jellyfin.gpg] https://repo.jellyfin.org/debian bookworm main" > /etc/apt/sources.list.d/jellyfin.list
          apt-get update -qq
          apt-get install --no-install-recommends -y postgresql-client-18 zstd jellyfin-ffmpeg7
          echo "/usr/lib/jellyfin-ffmpeg" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-${{ hashFiles('.ruby-version', 'Gemfile.lock', 'vendor/gems/**/*.gemspec') }}
          restore-keys: gems-${{ runner.os }}-
      - name: Install gems
        run: |
          gem install bundler -v "$(tail -1 Gemfile.lock | tr -d ' ')" --no-document
          bundle install
      - run: bin/rails db:test:prepare
      - run: bundle exec rubocop --no-color --format github
      - run: bundle exec srb tc
      - run: bundle exec rspec --format progress
      - run: bundle exec brakeman -q --no-pager --exit-on-warn
      - run: bundle exec bundler-audit check --update --config config/bundler-audit.yml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend test -- --run
      - run: bin/design-guard
