# Omakase Ruby styling + Sorbet sigil enforcement + house cops
# (rubocop/stream_cops.rb — each cop encodes a bug class a sibling app shipped).
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

plugins:
  - rubocop-sorbet

require:
  - ./rubocop/stream_cops

AllCops:
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "db/*_schema.rb"
    - "node_modules/**/*"
    - "vendor/**/*"
    - "sorbet/**/*"
    - "frontend/**/*"
    - "references/**/*"
    - "tmp/**/*"

Stream/NoParamsCast:
  Include:
    - "app/**/*.rb"

Stream/NoSingularErrorRender:
  Include:
    - "app/controllers/**/*.rb"

Stream/NoCrossEnumDeserialize:
  Include:
    - "app/**/*.rb"
    - "lib/**/*.rb"

Stream/NoRawNetHttp:
  Include:
    - "app/**/*.rb"
    - "lib/**/*.rb"
  Exclude:
    # The one sanctioned Net::HTTP call site: the shared client itself.
    - "app/services/upstream_http_client.rb"

Stream/NoUnreviewedPrivateEgress:
  Include:
    - "app/**/*.rb"
  Exclude:
    # The default lives here and is `false`; the cop is about overrides.
    - "app/services/upstream_http_client.rb"

# Every file in app/ and lib/ is typed: strict; downgrades happen case by
# case with a comment, never silently (hub convention).
Sorbet/StrictSigil:
  Enabled: true
  Include:
    - "app/**/*.rb"
  Exclude:
    - "app/**/concerns/**/*.rb" # reflection/DSL-driven; typed: strict where possible

Sorbet/EnforceSigilOrder:
  Enabled: true

# Specs define anonymous client classes in blocks (Class.new do def ... end)
# — that is the point of them, so this newer cop stays off.
Sorbet/BlockMethodDefinition:
  Enabled: false
Sorbet/ForbidTAnyWithNil:
  Enabled: true
# Constants keep their explicit T.let, matching the sibling apps' code.
Sorbet/RedundantTLetForLiteral:
  Enabled: false
Sorbet/Refinement:
  Enabled: true
