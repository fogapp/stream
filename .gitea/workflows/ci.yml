name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruby:
    runs-on: ubuntu-latest
    # Not ruby/setup-ruby: the act runner maps ubuntu-latest to a Debian image
    # that action refuses ("detected as self-hosted"), which meant this job
    # never got past checkout. A Ruby container needs no toolcache.
    container:
      image: ruby:3.4.2-bookworm
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: stream
          POSTGRES_PASSWORD: stream
        options: >-
          --health-cmd "pg_isready -U stream" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      RAILS_ENV: test
      # Container jobs reach services by name on the job network.
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: stream
      DATABASE_PASSWORD: stream
      BUNDLE_JOBS: "4"
    steps:
      # Shell, not actions/checkout: JavaScript actions need node inside the
      # job container, and the Ruby image has none until the tools step below
      # installs one.
      #
      # No actions/cache either: this runner's cache server is unreachable
      # from job containers (act_runner config.yaml `cache.host`), so every
      # restore and save is a 20s timeout — more than the 26s bundle install
      # it would skip. Worth revisiting once the runner is fixed.
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ gitea.token }}
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)" \
            fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - run: bin/check-tracked
      # The tools the production image ships (Dockerfile): specs shell out to
      # real pg_dump and tar+zstd, and quietly take a different path when one
      # is missing. postgresql-client comes from PGDG on the same pin —
      # bookworm's own is v15, the server is 18.
      - name: Install system tools
        run: |
          install -d /usr/share/postgresql-common/pgdg
          curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt bookworm-pgdg main' > /etc/apt/sources.list.d/pgdg.list
          apt-get update -qq
          install -d /etc/apt/keyrings
          curl -fsSL https://repo.jellyfin.org/jellyfin_team.gpg.key | gpg --dearmor -o /etc/apt/keyrings/jellyfin.gpg
          echo "deb [signed-by=/etc/apt/keyrings/jellyfin.gpg] https://repo.jellyfin.org/debian bookworm main" > /etc/apt/sources.list.d/jellyfin.list
          apt-get update -qq
          apt-get install --no-install-recommends -y postgresql-client-18 zstd jellyfin-ffmpeg7
          echo "/usr/lib/jellyfin-ffmpeg" >> "$GITHUB_PATH"
          zstd --version && pg_dump --version && /usr/lib/jellyfin-ffmpeg/ffprobe -version | head -1
      - name: Install gems
        run: |
          gem install bundler -v "$(tail -1 Gemfile.lock | tr -d ' ')" --no-document
          bundle install
      - run: bin/rails db:test:prepare
      - run: bundle exec rubocop --no-color
      - run: bundle exec srb tc
      - run: bundle exec rspec --format progress
      - run: bundle exec brakeman -q --no-pager --exit-on-warn
      - run: bundle exec bundler-audit check --update --config config/bundler-audit.yml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          # No `cache: npm` — same unreachable cache server as above.
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend test -- --run
      - run: bin/design-guard
