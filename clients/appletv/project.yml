# The Apple TV client (PROPOSAL §11 Phase 6), generated with XcodeGen:
# `make gen` writes StreamTV.xcodeproj from this file.
name: StreamTV
options:
  bundleIdPrefix: com.fogstack
  deploymentTarget:
    tvOS: "17.0"
targets:
  StreamTV:
    type: application
    platform: tvOS
    sources:
      - path: StreamTV
        excludes:
          - Resources/Showcase
      # Made-up titles for screenshots and looking around (App/Showcase.swift).
      - path: StreamTV/Resources/Showcase
        type: folder
      # The Top Shelf's snapshot, written here and read by StreamTopShelf.
      - Shared
    dependencies:
      - target: StreamTopShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fogstack.stream
        SWIFT_VERSION: 5.9
        DEVELOPMENT_TEAM: ${STREAM_TEAM_ID}
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
    info:
      path: StreamTV/Info.plist
      properties:
        CFBundleDisplayName: Stream
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        # Stream lives on the LAN, often over plain HTTP.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Stream plays video from your household's server on this network.
        # stream://open|play/<kind>/<id> and stream://live/<number>: the Top Shelf's links.
        CFBundleURLTypes:
          - CFBundleURLName: com.fogstack.stream
            CFBundleURLSchemes: [stream]
    entitlements:
      path: StreamTV/StreamTV.entitlements
      properties:
        com.apple.security.application-groups: [group.com.fogstack.stream]
  # The Top Shelf (Continue watching, On now) from the app's snapshot.
  StreamTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - StreamTopShelf
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fogstack.stream.topshelf
        SWIFT_VERSION: 5.9
        DEVELOPMENT_TEAM: ${STREAM_TEAM_ID}
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: StreamTopShelf/Info.plist
      properties:
        CFBundleDisplayName: Stream
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    entitlements:
      path: StreamTopShelf/StreamTopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.com.fogstack.stream]
  StreamTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - StreamTVTests
    dependencies:
      - target: StreamTV
    settings:
      base:
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: YES
  # Drives the app with the Siri Remote in the simulator, in the showcase,
  # and keeps a screenshot of each screen (make ui → build/screenshots).
  StreamTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - StreamTVUITests
    dependencies:
      - target: StreamTV
    settings:
      base:
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: StreamTV
schemes:
  StreamTV:
    build:
      targets:
        StreamTV: all
        StreamTVTests: [test]
        StreamTVUITests: [test]
    test:
      targets:
        - StreamTVTests
        - StreamTVUITests
